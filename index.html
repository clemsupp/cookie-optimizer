/* ==================================================

function decodeBase64(text) {

    text = text.trim();

    // Cookie Clicker ajoute parfois !END!
    if (text.endsWith("!END!")) {
        text = text.slice(0, -5);
    }

    // Sauvegarde Cookie Clicker = Base64 classique
    // avec possibilité de caractères URL-safe
    text = text
        .replace(/-/g, "+")
        .replace(/_/g, "/")
        .replace(/%3D/gi, "=")
        .replace(/%21/gi, "!");

    while (text.length % 4 !== 0) {
        text += "=";
    }

    let binary;

    try {
        binary = atob(text);
    } catch (e) {
        throw new Error("La sauvegarde Base64 est invalide.");
    }

    /*
     * Cookie Clicker utilise principalement de l'ASCII/UTF-8.
     * On utilise TextDecoder pour éviter les erreurs
     * de décodage de caractères.
     */

    const bytes = new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }

    try {
        return new TextDecoder("utf-8").decode(bytes);
    } catch (e) {
        // Fallback
        return binary;
    }
}

function number(value) {

    if (value === undefined || value === null || value === "") {
        return 0;
    }

    const n = Number(value);

    return Number.isFinite(n) ? n : 0;
}
