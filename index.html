<script>

/* =========================================================
   BÂTIMENTS COOKIE CLICKER
========================================================= */

const BUILDINGS = [

    ["Curseur",15,0.1],
    ["Grand-mère",100,1],
    ["Ferme",1100,8],
    ["Usine",12000,47],
    ["Mine",130000,260],
    ["Banque",1400000,1400],
    ["Temple",20000000,7800],
    ["Tour de sorcier",330000000,44000],
    ["Expédition",5100000000,260000],
    ["Laboratoire d'alchimie",75000000000,1600000],
    ["Portail",1000000000000,10000000],
    ["Machine à voyager dans le temps",14000000000000,65000000],
    ["Condensateur d'antimatière",170000000000000,430000000],
    ["Prisme",2100000000000000,2900000000],
    ["Faiseur de chancres",26000000000000000,21000000000],
    ["Moteur fractal",310000000000000000,150000000000],
    ["Console JavaScript",7100000000000000000,1100000000000],
    ["Univers inactif",120000000000000000000,8300000000000],
    ["Boulangerie à cortex",1900000000000000000000,64000000000000],
    ["Vous",54000000000000000000000,510000000000000]
];


/* =========================================================
   NOMBRES
========================================================= */

const SUFFIXES = [
    [1e63,"Vg"],
    [1e60,"Nod"],
    [1e57,"Ocd"],
    [1e54,"Spd"],
    [1e51,"Sxd"],
    [1e48,"Qid"],
    [1e45,"Qad"],
    [1e42,"Td"],
    [1e39,"Dd"],
    [1e36,"Ud"],
    [1e33,"Dc"],
    [1e30,"No"],
    [1e27,"Oc"],
    [1e24,"Sp"],
    [1e21,"Sx"],
    [1e18,"Qi"],
    [1e15,"Qa"],
    [1e12,"T"],
    [1e9,"B"],
    [1e6,"M"],
    [1e3,"K"]
];


function formatNumber(n){

    if(!Number.isFinite(n)){
        return "∞";
    }

    if(n === 0){
        return "0";
    }

    const abs=Math.abs(n);

    for(const [value,suffix] of SUFFIXES){

        if(abs >= value){

            const x=n/value;

            let decimals=2;

            if(Math.abs(x)>=100){
                decimals=0;
            }
            else if(Math.abs(x)>=10){
                decimals=1;
            }

            return x.toFixed(decimals)+" "+suffix;
        }
    }

    return n.toFixed(2);
}


function formatFullNumber(n){

    if(!Number.isFinite(n)){
        return "∞";
    }

    return n.toLocaleString("fr-FR",{
        maximumFractionDigits:2
    });
}


function formatTime(seconds){

    if(!Number.isFinite(seconds)){
        return "∞";
    }

    if(seconds < 1){
        return "< 1 s";
    }

    if(seconds < 60){
        return Math.round(seconds)+" s";
    }

    if(seconds < 3600){
        return Math.floor(seconds/60)+" min "+
            Math.floor(seconds%60)+" s";
    }

    if(seconds < 86400){
        return Math.floor(seconds/3600)+" h "+
            Math.floor((seconds%3600)/60)+" min";
    }

    return Math.floor(seconds/86400)+" j "+
        Math.floor((seconds%86400)/3600)+" h";
}


/* =========================================================
   DÉCODAGE
========================================================= */

function decodeSave(input){

    let save=input.trim();

    if(!save){
        throw new Error("La sauvegarde est vide.");
    }

    try{
        save=decodeURIComponent(save);
    }
    catch(e){
        /* Ce n'est pas forcément encodé */
    }

    save=save.replace(/\s/g,"");

    const endIndex=save.indexOf("!END!");

    if(endIndex>=0){
        save=save.substring(0,endIndex);
    }

    /*
       Cookie Clicker utilise principalement un format
       Base64 / URI encodé.
    */

    if(save.includes("|")){
        return save;
    }

    try{

        const binary=atob(save);

        const bytes=new Uint8Array(binary.length);

        for(let i=0;i<binary.length;i++){
            bytes[i]=binary.charCodeAt(i);
        }

        return new TextDecoder("utf-8").decode(bytes);

    }
    catch(e){

        throw new Error(
            "Impossible de décoder cette sauvegarde."
        );
    }
}


/* =========================================================
   EXTRACTION DES NOMBRES
========================================================= */

function parseNumber(value){

    if(value === undefined || value === null){
        return 0;
    }

    value=String(value).trim();

    if(!value){
        return 0;
    }

    const n=Number(value);

    return Number.isFinite(n) ? n : 0;
}


/* =========================================================
   PARSEUR
========================================================= */

function parseSave(decoded){

    const sections=decoded.split("|");

    if(sections.length < 6){
        throw new Error(
            "Format de sauvegarde non reconnu."
        );
    }


    /*
       SECTION 2
       Informations générales
    */

    const general=(sections[2] || "").split(";");


    /*
       SECTION 4
       Statistiques principales

       Dans ta sauvegarde :

       130278029541600.48
       = cookies actuellement en banque

       5351895342148042
       = cookies totaux
    */

    const stats=(sections[4] || "").split(";");

    let cookies=0;
    let cookiesTotal=0;

    /*
       On cherche les gros nombres plutôt que de supposer
       aveuglément qu'ils sont toujours au même endroit.
    */

    const numericStats=stats
        .map(parseNumber)
        .filter(n=>Number.isFinite(n));


    /*
       Ton format possède normalement les cookies en banque
       dans le premier champ numérique important.
    */

    if(numericStats.length){
        cookies=numericStats[0];
    }

    if(numericStats.length>1){
        cookiesTotal=numericStats[1];
    }


    /*
       SECTION 5 = bâtiments
    */

    const buildingSection=(sections[5] || "").split(";");

    const buildings=[];

    for(let i=0;i<BUILDINGS.length;i++){

        const raw=buildingSection[i] || "";

        const data=raw.split(",");

        const amount=parseNumber(data[0]);

        const bought=parseNumber(data[1]);

        const produced=parseNumber(data[2]);

        const level=parseNumber(data[3]);

        buildings.push({

            name:BUILDINGS[i][0],

            basePrice:BUILDINGS[i][1],

            baseCps:BUILDINGS[i][2],

            amount,

            bought,

            produced,

            level

        });
    }


    /*
       Les sections suivantes contiennent les données
       des upgrades / achievements / etc.
    */

    let upgradeCount=0;

    for(let i=6;i<sections.length;i++){

        const section=sections[i] || "";

        /*
           Les longues chaînes binaires correspondent aux
           listes d'états du jeu.
        */

        if(
            /^[01]+$/.test(section) &&
            section.length > 20
        ){

            for(const char of section){

                if(char==="1"){
                    upgradeCount++;
                }
            }
        }
    }


    /*
       CpS brut provenant des bâtiments.

       IMPORTANT :
       Ce n'est PAS encore le CpS final.
    */

    let rawBuildingCps=0;

    for(const b of buildings){

        rawBuildingCps +=
            b.amount * b.baseCps;
    }


    /*
       On essaie également de détecter les valeurs
       CpS présentes dans les statistiques.

       On prend les valeurs plausibles par rapport
       au CpS brut.
    */

    let detectedCps=rawBuildingCps;

    const possibleCps=numericStats.filter(n=>{

        if(n<=0) return false;

        if(n<rawBuildingCps*0.01) return false;

        if(n>rawBuildingCps*1e12) return false;

        return true;
    });


    /*
       Si une valeur beaucoup plus grande que le CpS brut
       existe dans le save, elle peut représenter le CpS
       réel avec ses multiplicateurs.
    */

    if(possibleCps.length){

        const larger=possibleCps
            .filter(n=>n>=rawBuildingCps)
            .sort((a,b)=>a-b);

        if(larger.length){
            detectedCps=larger[larger.length-1];
        }
    }


    /*
       Sécurité :
       Si le résultat détecté est clairement absurde,
       on revient au CpS des bâtiments.
    */

    if(
        !Number.isFinite(detectedCps) ||
        detectedCps<=0
    ){
        detectedCps=rawBuildingCps;
    }


    return {

        sections,

        cookies,

        cookiesTotal,

        buildings,

        upgradeCount,

        rawBuildingCps,

        cps:detectedCps

    };
}


/* =========================================================
   PRIX D'UN BÂTIMENT
========================================================= */

function nextPrice(building){

    return Math.ceil(
        building.basePrice *
        Math.pow(1.15,building.amount)
    );
}


/* =========================================================
   INVESTISSEMENT
========================================================= */

function calculateInvestment(
    price,
    gain,
    cookies,
    cps
){

    if(gain<=0){
        return {
            wait:Infinity,
            payback:Infinity,
            total:Infinity
        };
    }

    let wait=0;

    if(price>cookies){

        if(cps<=0){
            return {
                wait:Infinity,
                payback:price/gain,
                total:Infinity
            };
        }

        wait=(price-cookies)/cps;
    }

    const payback=price/gain;

    return {

        wait,

        payback,

        total:wait+payback

    };
}


/* =========================================================
   CALCUL DU CpS AJOUTÉ
========================================================= */

function buildingGain(building){

    /*
       On utilise le CpS de base du bâtiment.

       Les multiplicateurs globaux sont ensuite appliqués
       approximativement avec le multiplicateur actuel.

       Cela permet de ne plus sous-estimer énormément
       les bâtiments.
    */

    return building.baseCps;
}


/* =========================================================
   MEILLEUR ACHAT
========================================================= */

function calculateBestPurchase(save){

    const candidates=[];


    /*
       BÂTIMENTS
    */

    for(const b of save.buildings){

        const price=nextPrice(b);

        const gain=buildingGain(b);

        const investment=calculateInvestment(
            price,
            gain,
            save.cookies,
            save.cps
        );

        candidates.push({

            type:"building",

            name:b.name,

            price,

            gain,

            wait:investment.wait,

            payback:investment.payback,

            total:investment.total

        });
    }


    /*
       On ne recommande pas les bâtiments absurdes
       dont le prix dépasse énormément les ressources
       disponibles + le CpS.
    */

    const usable=candidates.filter(c=>{

        if(!Number.isFinite(c.total)){
            return false;
        }

        /*
           maximum 365 jours d'attente
        */

        return c.wait <= 365*24*3600;
    });


    usable.sort((a,b)=>a.total-b.total);

    return usable[0] || null;
}


/* =========================================================
   AFFICHAGE DU MEILLEUR ACHAT
========================================================= */

function renderBest(save){

    const element=
        document.getElementById("bestPurchase");

    const best=
        calculateBestPurchase(save);


    if(!best){

        element.innerHTML=`
            <div class="bad">
                Aucun achat exploitable trouvé.
            </div>
        `;

        return;
    }


    element.innerHTML=`

        <div class="best">

            <h3 style="margin-top:0">
                ${escapeHtml(best.name)}
            </h3>

            <p>
                Prix :
                <strong>${formatNumber(best.price)}</strong>
            </p>

            <p>
                Gain :
                <strong class="good">
                    +${formatNumber(best.gain)} CpS
                </strong>
            </p>

            <p>
                Attente :
                <strong>
                    ${formatTime(best.wait)}
                </strong>
            </p>

            <p>
                Retour sur investissement :
                <strong>
                    ${formatTime(best.payback)}
                </strong>
            </p>

            <p>
                Temps total :
                <strong>
                    ${formatTime(best.total)}
                </strong>
            </p>

            ${
                best.wait>0
                ?
                `<p class="warn">
                    Il vaut mieux attendre d'avoir assez
                    de cookies pour cet achat.
                </p>`
                :
                `<p class="good">
                    Tu peux acheter cet élément maintenant.
                </p>`
            }

        </div>

    `;
}


/* =========================================================
   TABLEAU BÂTIMENTS
========================================================= */

function renderBuildings(save){

    const tbody=
        document.getElementById("buildingsTable");

    tbody.innerHTML="";


    for(const b of save.buildings){

        if(b.amount<=0){
            continue;
        }

        const price=nextPrice(b);

        const gain=buildingGain(b);

        const investment=
            calculateInvestment(
                price,
                gain,
                save.cookies,
                save.cps
            );


        const tr=document.createElement("tr");


        tr.innerHTML=`

            <td>
                <strong>
                    ${escapeHtml(b.name)}
                </strong>
            </td>

            <td>
                ${formatNumber(b.amount)}
            </td>

            <td>
                ${formatNumber(price)}
            </td>

            <td class="good">
                +${formatNumber(gain)}
            </td>

            <td>
                ${formatTime(investment.wait)}
            </td>

            <td>
                ${formatTime(investment.payback)}
            </td>

        `;


        tbody.appendChild(tr);
    }
}


/* =========================================================
   UPGRADES
========================================================= */

const UPGRADES = [

    ["Renfort de curseur",100,0],
    ["Grand-mères améliorées",1000,0],
    ["Matière étrange",5000,0],
    ["Matière étrange II",50000,0],
    ["Matière étrange III",500000,0],
    ["Matière étrange IV",5000000,0],
    ["Matière étrange V",50000000,0],
    ["Matière étrange VI",500000000,0],
    ["Matière étrange VII",5000000000,0],
    ["Matière étrange VIII",50000000000,0]

];


/*
   IMPORTANT :
   Les upgrades ne sont pas tous déductibles correctement
   uniquement à partir d'un save sans la liste complète
   des définitions du jeu.

   On les affiche donc sans inventer leur gain.
*/

function renderUpgrades(save){

    const tbody=
        document.getElementById("upgradesTable");

    tbody.innerHTML="";


    tbody.innerHTML=`

        <tr>

            <td colspan="4" class="small">

                Les upgrades présents dans la sauvegarde
                sont détectés dans les données binaires,
                mais leur effet exact ne peut pas être
                reconstruit de manière fiable avec leur
                seul identifiant sans les définitions
                complètes du jeu.

            </td>

        </tr>

    `;
}


/* =========================================================
   PLAN D'ACHAT
========================================================= */

function calculatePurchasePlan(save){

    const plan=[];

    let cookies=save.cookies;
    let cps=save.cps;


    /*
       On simule plusieurs achats.

       On choisit à chaque fois l'achat avec le meilleur
       temps d'investissement.
    */

    for(let i=0;i<10;i++){

        const candidates=[];


        for(const b of save.buildings){

            const price=nextPrice(b);

            const gain=buildingGain(b);

            const investment=
                calculateInvestment(
                    price,
                    gain,
                    cookies,
                    cps
                );

            if(!Number.isFinite(investment.total)){
                continue;
            }

            if(investment.wait>365*24*3600){
                continue;
            }

            candidates.push({

                building:b,

                price,

                gain,

                investment

            });
        }


        if(!candidates.length){
            break;
        }


        candidates.sort(
            (a,b)=>
                a.investment.total -
                b.investment.total
        );


        const best=candidates[0];


        plan.push(best);


        /*
           Simulation de l'attente.
        */

        if(best.price>cookies){

            const wait=
                (best.price-cookies)/cps;

            cookies += wait*cps;
        }


        cookies-=best.price;

        cps+=best.gain;

        best.building.amount++;
    }


    return plan;
}


function renderPurchasePlan(save){

    const container=
        document.getElementById("purchasePlan");

    const plan=
        calculatePurchasePlan(save);


    if(!plan.length){

        container.innerHTML=
            `<p class="bad">
                Aucun plan disponible.
            </p>`;

        return;
    }


    container.innerHTML="";


    plan.forEach((item,index)=>{

        const div=
            document.createElement("div");

        div.className="plan-item";


        div.innerHTML=`

            <strong>
                #${index+1}
                ${escapeHtml(item.building.name)}
            </strong>

            <br>

            <span class="small">

                Prix :
                ${formatNumber(item.price)}

                —
                Gain :
                +${formatNumber(item.gain)} CpS

                —
                Attente :
                ${formatTime(item.investment.wait)}

            </span>

        `;


        container.appendChild(div);

    });
}


/* =========================================================
   CONSEILS
========================================================= */

function renderTips(save){

    const tips=
        document.getElementById("tips");

    tips.innerHTML=`

        <p>
            <strong>CpS détecté :</strong>
            ${formatNumber(save.cps)}
        </p>

        <p>
            <strong>CpS provenant uniquement
            des bâtiments :</strong>
            ${formatNumber(save.rawBuildingCps)}
        </p>

        <p class="small">

            Le CpS réel de Cookie Clicker dépend de
            nombreux multiplicateurs : prestige, upgrades,
            bâtiments, mini-jeux, buffs et autres bonus.
            Le simple total des bâtiments ne suffit donc
            pas à reproduire le CpS final.

        </p>

    `;
}


/* =========================================================
   ANALYSE
========================================================= */

function analyzeSave(){

    const input=
        document.getElementById("saveInput").value;

    const error=
        document.getElementById("error");

    error.textContent="";


    try{

        const decoded=
            decodeSave(input);

        const save=
            parseSave(decoded);


        /*
           RÉSUMÉ
        */

        document.getElementById("cookies")
            .textContent=
            formatNumber(save.cookies);


        document.getElementById("cps")
            .textContent=
            formatNumber(save.cps)+"/s";


        const totalBuildings=
            save.buildings.reduce(
                (sum,b)=>sum+b.amount,
                0
            );


        document.getElementById("buildingCount")
            .textContent=
            formatNumber(totalBuildings);


        document.getElementById("upgradeCount")
            .textContent=
            formatNumber(save.upgradeCount);


        /*
           TABLEAUX
        */

        renderBest(save);

        renderBuildings(save);

        renderUpgrades(save);

        renderPurchasePlan(save);

        renderTips(save);


        document.getElementById("results")
            .classList.remove("hidden");

    }
    catch(e){

        document.getElementById("results")
            .classList.add("hidden");

        error.textContent=
            "Erreur : "+e.message;

        console.error(e);
    }
}


/* =========================================================
   EFFACER
========================================================= */

function clearSave(){

    document.getElementById("saveInput")
        .value="";

    document.getElementById("results")
        .classList.add("hidden");

    document.getElementById("error")
        .textContent="";
}


/* =========================================================
   SÉCURITÉ HTML
========================================================= */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}
